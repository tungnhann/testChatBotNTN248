name: Daily Sync Job

on:
  schedule:
    - cron: '0 20 * * *' # Chạy vào 20:00 UTC (3:00 sáng giờ VN)
  workflow_dispatch: # Cho phép bấm chạy bằng tay

permissions:
  contents: write # Cấp quyền để Github Actions được phép ghi đè (commit) file mới lên kho

jobs:
  run-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Build Docker Image
      - name: Build Docker Image
        run: docker build -t daily-sync-app .

      # 2. Run Script in Docker with Volume Mount
      - name: Run Main Script via Docker
        env:
          OPENAI_SECRET: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Dùng -v để map ổ cứng của Github vào Docker, giúp Docker lưu file sync_state.json ra ngoài
          docker run -v ${{ github.workspace }}:/app -w /app -e OPENAI_API_KEY="$OPENAI_SECRET" daily-sync-app python main.py
          # Cấp lại quyền sở hữu file cho user hiện tại để git có thể commit
          sudo chown -R $USER:$USER ${{ github.workspace }}

      # 3. Commit file state
      - name: Save sync state to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sync_state.json
          
          # Lấy dòng kết quả cuối cùng từ file sync.log
          MSG=$(grep "Sync complete" sync.log | tail -n 1 | sed 's/.*INFO - //')
          if [ -n "$MSG" ]; then
            echo "$(date +'%Y-%m-%d %H:%M:%S') - $MSG" >> history.log
            git add history.log
          else
            MSG="chore: auto-save sync state"
          fi
          
          # Bắt buộc tạo commit mỗi ngày để ghi nhận lịch sử (kể cả khi không có bài nào mới)
          git commit --allow-empty -m "$MSG"
          
          # Cất tạm các file bị thay đổi (như log, pycache) để không bị lỗi khi pull
          git stash || true
          git pull --rebase origin main
          git push