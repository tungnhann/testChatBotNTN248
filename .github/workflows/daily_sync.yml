name: Daily Sync Job

on:
  schedule:
    - cron: '0 0 * * *' # Chạy vào 00:00 UTC mỗi ngày
  workflow_dispatch: # Cho phép bấm chạy bằng tay

jobs:
  run-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Build Docker Image chung cho cả dự án
      - name: Build Docker Image
        run: docker build -t daily-sync-app .

      # 2. Chạy cái thứ nhất (main.py)
      - name: Run Main Script via Docker
        env:
          OPENAI_SECRET: ${{ secrets.OPENAI_API_KEY }}
        run: docker run -e OPENAI_API_KEY="$OPENAI_SECRET" daily-sync-app python main.py